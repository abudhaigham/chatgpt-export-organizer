[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chatgpt-export-organizer"
version = "1.1.0"
description = "Privacy-first tooling to map, organize, restore, extract, and render ChatGPT data exports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammad Alhajri" }]
keywords = ["chatgpt", "data-export", "archive", "pdf", "privacy"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving",
  "Topic :: Utilities",
]

[project.optional-dependencies]
pdf = [
  "reportlab>=4.2,<5",
  "arabic-reshaper>=3,<4",
  "python-bidi>=0.6,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
chatgpt-export-organizer = "chatgpt_export_organizer.cli:main"

[project.urls]
Homepage = "https://github.com/abudhaigham/chatgpt-export-organizer"
Repository = "https://github.com/abudhaigham/chatgpt-export-organizer"
Issues = "https://github.com/abudhaigham/chatgpt-export-organizer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_export_organizer"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["examples/synthetic_export"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
